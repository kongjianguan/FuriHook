<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FuriHook Via Ruby E2E</title>
  <style>
    body { font: 16px/1.35 sans-serif; margin: 8px; }
    h1 { font-size: 20px; margin: 6px 0; }
    p { margin: 4px 0; }
    button, input, [contenteditable="true"] { display: block; margin: 4px 0; padding: 2px; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; font: 10px/1.25 monospace; }
  </style>
</head>
<body>
  <h1>FuriHook Via Ruby E2E</h1>
  <p id="original">今日は学校で日本語を勉強します。</p>
  <pre id="result">{"phase":"loading"}</pre>
  <p><a id="test-link" aria-label="Open link" href="#link-result">Open link <span>日本語</span></a></p>
  <p id="link-result">链接触发次数：<span id="link-count">0</span></p>
  <button id="update-button" type="button">生成动态 Ruby 注音</button>
  <p id="updated">更新前</p>
  <section id="react-fixture">
    <p>React 页面原文与译文切换</p>
    <div id="react-root"></div>
  </section>
  <label for="excluded-input">输入框排除检查</label>
  <input id="excluded-input" value="漢字入力">
  <div id="excluded-editable" contenteditable="true">編集可能な漢字</div>
  <p id="existing-ruby">既有 Ruby 检查：<ruby id="user-ruby">漢<rt>かん</rt></ruby></p>
  <script>
    (() => {
      const result = document.getElementById("result");
      const original = document.getElementById("original");
      const updated = document.getElementById("updated");
      const linkCount = document.getElementById("link-count");
      const diagnosticRequested = new URLSearchParams(window.location.search).get("diagnostic") === "1";
      const expectedOriginal = ["今日:きょう", "学校:がっこう", "日本語:にほんご", "勉強:べんきょう"];
      let updateRequested = false;
      let diagnosticStarted = false;

      function baseText(element) {
        const clone = element.cloneNode(true);
        clone.querySelectorAll("rt, rp").forEach((node) => node.remove());
        return clone.textContent;
      }

      function hookInspection() {
        return window.FuriHook102 && typeof window.FuriHook102.inspect === "function"
          ? JSON.parse(window.FuriHook102.inspect(diagnosticRequested)) : null;
      }

      function annotationsForText(inspection, text) {
        if (!inspection) return [];
        const ids = new Set(inspection.hostNodes.filter((node) => node.connected && node.data === text)
          .map((node) => node.nodeId));
        return inspection.annotations.filter((annotation) => ids.has(annotation.nodeId));
      }

      function moduleRecordsForNode(node) {
        const records = window.__FuriHook102 && window.__FuriHook102.records;
        return records instanceof Map
          ? Array.from(records.values()).filter((record) => record.node === node) : [];
      }

      function moduleCoverageForNode(inspection, node) {
        const records = moduleRecordsForNode(node);
        const nodeIds = new Set(records.map((record) => record.nodeId));
        const annotations = inspection
          ? inspection.annotations.filter((annotation) => nodeIds.has(annotation.nodeId)) : [];
        return {recordCount: records.length,
          analyzedSegmentCount: records.reduce((count, record) =>
            count + (Array.isArray(record.segments) ? record.segments.length : 0), 0),
          nodeIds: Array.from(nodeIds), annotationCount: annotations.length};
      }

      function pairs(annotations) {
        return annotations.map((annotation) => `${annotation.baseText}:${annotation.reading}`);
      }

      function rectanglesIntersect(a, b) {
        return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
      }

      function layoutIsClear(annotations) {
        return annotations.filter((annotation) => annotation.visible).every((annotation) =>
          annotation.clearance === "clear" && annotation.readingRect.bottom <= annotation.baseRect.top
            && annotation.textRects.every((rect) => !rectanglesIntersect(annotation.readingRect, rect)));
      }

      function rectData(rect) {
        return {left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom,
          width: rect.width, height: rect.height};
      }

      function styleData(element) {
        const style = getComputedStyle(element);
        return {display: style.display, position: style.position, font: style.font,
          fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight,
          fontStyle: style.fontStyle, lineHeight: style.lineHeight, letterSpacing: style.letterSpacing,
          writingMode: style.writingMode, transform: style.transform, zoom: style.zoom,
          overflowX: style.overflowX, overflowY: style.overflowY, color: style.color,
          backgroundColor: style.backgroundColor, backgroundImage: style.backgroundImage,
          border: style.border, opacity: style.opacity, visibility: style.visibility};
      }

      function nodeRanges(element) {
        const output = [];
        const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (!node.data.length) continue;
          const range = document.createRange();
          range.selectNodeContents(node);
          output.push({text: node.data, length: node.data.length,
            rects: Array.from(range.getClientRects(), rectData)});
        }
        return output;
      }

      function clipChain(node) {
        const chain = [];
        let element = node.parentElement;
        while (element) {
          const style = getComputedStyle(element);
          const clips = [style.overflowX, style.overflowY].some((value) =>
            value === "auto" || value === "scroll" || value === "hidden" || value === "clip");
          if (clips) {
            const box = element.getBoundingClientRect();
            const left = box.left + element.clientLeft;
            const top = box.top + element.clientTop;
            chain.push({tag: element.tagName, id: element.id, className: String(element.className || ""),
              box: rectData(box), clientBox: {left, top, right: left + element.clientWidth,
                bottom: top + element.clientHeight, width: element.clientWidth, height: element.clientHeight},
              style: styleData(element)});
          }
          element = element.parentElement;
        }
        return chain;
      }

      function hitStack(rect) {
        const insetX = Math.min(1, rect.width / 4);
        const insetY = Math.min(1, rect.height / 4);
        const points = [
          [rect.left + rect.width / 2, rect.top + rect.height / 2],
          [rect.left + insetX, rect.top + insetY],
          [rect.right - insetX, rect.top + insetY],
          [rect.left + insetX, rect.bottom - insetY],
          [rect.right - insetX, rect.bottom - insetY]
        ];
        return points.map(([x, y]) => ({x, y,
          elements: document.elementsFromPoint(x, y).slice(0, 8).map((element) => {
            const box = element.getBoundingClientRect();
            return {tag: element.tagName, id: element.id,
              className: String(element.className || "").slice(0, 160),
              text: (element.textContent || "").slice(0, 100), style: styleData(element),
              rect: rectData(box)};
          })}));
      }

      function characterGeometry(element) {
        const node = element.firstChild;
        if (!node || node.nodeType !== Node.TEXT_NODE) {
          throw new Error("诊断正文必须保留一个真实 Text 节点");
        }
        const source = node.data;
        const style = styleData(element);
        const clipAncestors = clipChain(node);
        const viewport = {left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight,
          width: window.innerWidth, height: window.innerHeight};
        const characters = [];
        const segments = [];
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        const state = window.__FuriHook102;
        if (state && state.records instanceof Map) {
          for (const record of state.records.values()) {
            if (record.node !== node || !record.segments) continue;
            for (const segment of record.segments) {
              const start = record.offset + segment[0];
              const end = record.offset + segment[1];
              const range = document.createRange();
              range.setStart(node, start);
              range.setEnd(node, end);
              const base = range.getBoundingClientRect();
              const rubySize = Math.max(8, Number.parseFloat(style.fontSize) * 0.5);
              context.font = `${style.fontStyle} ${style.fontWeight} ${rubySize}px ${style.fontFamily}`;
              const acceptedReadingFont = context.font;
              const readingMetrics = context.measureText(segment[2]);
              context.font = style.font;
              const acceptedBaseFont = context.font;
              const baseMetrics = context.measureText(node.data.slice(start, end));
              const scaleX = baseMetrics.width > 0 ? base.width / baseMetrics.width : 1;
              const readingWidth = readingMetrics.width * scaleX;
              const height = Math.max(rubySize,
                readingMetrics.actualBoundingBoxAscent + readingMetrics.actualBoundingBoxDescent);
              const gap = Math.max(1, rubySize * 0.16);
              const candidate = {left: (base.left + base.right - readingWidth) / 2,
                right: (base.left + base.right + readingWidth) / 2,
                top: base.top - height - gap, bottom: base.top - gap,
                width: readingWidth, height};
              segments.push({startUtf16: start, endUtf16: end,
                baseText: node.data.slice(start, end), reading: segment[2],
                baseRect: rectData(base), baseRects: Array.from(range.getClientRects(), rectData),
                rubySize, acceptedReadingFont, acceptedBaseFont, scaleX,
                baseFontAscent: baseMetrics.fontBoundingBoxAscent,
                baseFontDescent: baseMetrics.fontBoundingBoxDescent,
                baseInkAscent: baseMetrics.actualBoundingBoxAscent,
                baseInkDescent: baseMetrics.actualBoundingBoxDescent,
                readingInkAscent: readingMetrics.actualBoundingBoxAscent,
                readingInkDescent: readingMetrics.actualBoundingBoxDescent,
                candidateReadingArea: candidate, candidateAreaHitStack: hitStack(candidate)});
            }
          }
        }
        let offset = 0;
        for (const character of source) {
          const startUtf16 = offset;
          offset += character.length;
          if (!/\p{Script=Han}/u.test(character)) continue;
          const range = document.createRange();
          range.setStart(node, startUtf16);
          range.setEnd(node, offset);
          const rects = Array.from(range.getClientRects(), rectData);
          const rangeBox = range.getBoundingClientRect();
          const fontSize = Number.parseFloat(style.fontSize);
          const probeHeight = fontSize * 0.5;
          const probe = {left: (rangeBox.left + rangeBox.right) / 2 - rangeBox.width / 2,
            right: (rangeBox.left + rangeBox.right) / 2 + rangeBox.width / 2,
            top: rangeBox.top - probeHeight - Math.max(1, fontSize * 0.16),
            bottom: rangeBox.top - Math.max(1, fontSize * 0.16),
            width: rangeBox.width, height: probeHeight};
          let clipped = {left: Math.max(rangeBox.left, viewport.left),
            top: Math.max(rangeBox.top, viewport.top), right: Math.min(rangeBox.right, viewport.right),
            bottom: Math.min(rangeBox.bottom, viewport.bottom)};
          for (const ancestor of clipAncestors) {
            clipped.left = Math.max(clipped.left, ancestor.clientBox.left);
            clipped.top = Math.max(clipped.top, ancestor.clientBox.top);
            clipped.right = Math.min(clipped.right, ancestor.clientBox.right);
            clipped.bottom = Math.min(clipped.bottom, ancestor.clientBox.bottom);
          }
          characters.push({character, startUtf16, endUtf16: offset, rect: rectData(rangeBox), rects,
            viewportIntersection: clipped, fullyVisible: clipped.left <= rangeBox.left
              && clipped.top <= rangeBox.top && clipped.right >= rangeBox.right
              && clipped.bottom >= rangeBox.bottom,
            candidateReadingArea: probe, candidateAreaHitStack: hitStack(probe),
            font: style, clipAncestors});
        }
        const baselineProbe = document.createElement("span");
        baselineProbe.setAttribute("data-furihook-owned", "1");
        baselineProbe.style.cssText = "all:initial!important;display:inline-block!important;width:0!important;height:0!important;padding:0!important;border:0!important;margin:0!important;vertical-align:baseline!important;";
        element.appendChild(baselineProbe);
        const measuredBaseline = baselineProbe.getBoundingClientRect().top;
        baselineProbe.remove();
        return {text: source, nodeLengthUtf16: source.length,
          nodeIdentity: node === element.firstChild && node.parentNode === element,
          parentTag: element.tagName, parentId: element.id, elementStyle: style,
          range: rectData(element.getBoundingClientRect()), measuredBaseline,
          characters, productionSegments: segments};
      }

      function neighboringRanges(element) {
        const previous = element.previousElementSibling;
        const next = element.nextElementSibling;
        const heading = document.querySelector("h1");
        return {
          heading: heading ? {tag: heading.tagName, id: heading.id,
            style: styleData(heading), range: rectData(heading.getBoundingClientRect()),
            textRanges: nodeRanges(heading)} : null,
          previous: previous ? {tag: previous.tagName, id: previous.id,
            style: styleData(previous), range: rectData(previous.getBoundingClientRect()),
            textRanges: nodeRanges(previous)} : null,
          next: next ? {tag: next.tagName, id: next.id,
            style: styleData(next), range: rectData(next.getBoundingClientRect()),
            textRanges: nodeRanges(next)} : null
        };
      }

      function stableDiagnosticCapture() {
        if (diagnosticStarted) return;
        const inspection = hookInspection();
        if (!inspection || !inspection.scan?.initialDone || inspection.scan.awaitingReadings !== 0
            || inspection.scan.pendingBatches !== 0 || !window.reactFixture) {
          requestAnimationFrame(stableDiagnosticCapture);
          return;
        }
        diagnosticStarted = true;
        const initialSignature = JSON.stringify({rect: rectData(original.getBoundingClientRect()),
          annotations: inspection.annotationCount, passes: inspection.layoutPasses,
          text: original.firstChild?.data});
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const current = hookInspection();
          const signature = JSON.stringify({rect: rectData(original.getBoundingClientRect()),
            annotations: current.annotationCount, passes: current.layoutPasses,
            text: original.firstChild?.data});
          if (!current.scan?.initialDone || current.scan.awaitingReadings !== 0
              || current.scan.pendingBatches !== 0 || signature !== initialSignature) {
            diagnosticStarted = false;
            requestAnimationFrame(stableDiagnosticCapture);
            return;
          }
          const initialOriginal = characterGeometry(original);
          const initialNeighbors = neighboringRanges(original);
          const initialInspection = current;
          const initialReact = window.reactFixture.inspect();
          window.reactFixture.setMode("original");
          waitForReactLayout(initialOriginal, initialNeighbors, initialInspection, initialReact);
        }));
      }

      function waitForReactLayout(initialOriginal, initialNeighbors, initialInspection, initialReact) {
        requestAnimationFrame(() => {
          const react = window.reactFixture.inspect();
          const inspection = hookInspection();
          const reactElement = document.getElementById("react-current");
          const reactRecord = window.__FuriHook102 &&
            Array.from(window.__FuriHook102.records.values()).find(record =>
              record.node === reactElement?.firstChild && record.text === react.postText);
          if (react.mode !== "original" || !inspection?.scan?.initialDone
              || inspection.scan.awaitingReadings !== 0 || inspection.scan.pendingBatches !== 0
              || inspection.scan.dirtyRoots !== 0 || inspection.scan.dirtyNodes !== 0
              || inspection.scan.dirtyWalker || !reactRecord?.segments?.length) {
            waitForReactLayout(initialOriginal, initialNeighbors, initialInspection, initialReact);
            return;
          }
          const reactGeometry = characterGeometry(reactElement);
          const annotations = inspection.annotations.filter((item) =>
            item.nodeId === inspection.hostNodes.find((node) =>
              node.connected && node.data === react.postText)?.nodeId);
          const report = {phase: "diagnostic-ready", mode: "actual-via-layout",
            capturedAt: new Date().toISOString(), url: window.location.href,
            viewport: {innerWidth: window.innerWidth, innerHeight: window.innerHeight,
              devicePixelRatio: window.devicePixelRatio,
              visualViewport: window.visualViewport ? {offsetLeft: window.visualViewport.offsetLeft,
                offsetTop: window.visualViewport.offsetTop, width: window.visualViewport.width,
                height: window.visualViewport.height, scale: window.visualViewport.scale} : null},
            initialOriginal: initialOriginal, initialNeighbors: initialNeighbors,
            initialInspection: initialInspection, initialReact: initialReact,
            reactOriginal: react, reactOriginalGeometry: reactGeometry,
            reactOriginalNeighbors: neighboringRanges(reactElement),
            reactOriginalInspection: inspection, reactOriginalAnnotations: annotations,
            inspectionRejections: inspection.rejections || null};
          result.textContent = JSON.stringify(report);
        });
      }

      function renderReport() {
        const inspection = hookInspection();
        const originalNode = original.firstChild;
        const editable = document.getElementById("excluded-editable");
        const editableNode = editable.firstChild;
        const originalCoverage = moduleCoverageForNode(inspection, originalNode);
        const editableCoverage = moduleCoverageForNode(inspection, editableNode);
        const originalAnnotations = annotationsForText(inspection, original.textContent);
        const updatedAnnotations = annotationsForText(inspection, updated.textContent);
        const expectedUpdated = ["明日:あした", "図書館:としょかん", "行:い"];
        const existing = document.getElementById("user-ruby");
        const react = window.reactFixture ? window.reactFixture.inspect() : null;
        const reactAnnotations = react ? annotationsForText(inspection, react.postText) : [];
        const reactRows = react ? annotationsForText(inspection, react.schoolText || "") : [];
        const reactAdded = react ? annotationsForText(inspection, react.addedText || "") : [];
        const originalPairs = pairs(originalAnnotations);
        const updatedPairs = pairs(updatedAnnotations);
        const report = {
          phase: "waiting",
          originalText: baseText(original),
          originalRubies: originalPairs,
          originalRubyMatch: JSON.stringify(originalPairs) === JSON.stringify(expectedOriginal),
          updateRequested,
          updatedText: baseText(updated),
          updatedRubies: updatedPairs,
          updatedRubyMatch: JSON.stringify(updatedPairs) === JSON.stringify(expectedUpdated),
          linkClickCount: Number(linkCount.textContent),
          inputRubyCount: document.querySelectorAll("#excluded-input ruby").length,
          editableRubyCount: document.querySelectorAll("#excluded-editable ruby").length,
          inputValuePreserved: document.getElementById("excluded-input").value === "漢字入力",
          editableTextPreserved: baseText(document.getElementById("excluded-editable")) === "編集可能な漢字",
          plainRecordCoverage: originalNode.nodeType === Node.TEXT_NODE && originalCoverage.recordCount > 0
            && originalCoverage.analyzedSegmentCount > 0,
          editableRecordCoverage: editableNode.nodeType === Node.TEXT_NODE
            && editableCoverage.recordCount === 0 && editableCoverage.annotationCount === 0,
          plainModuleCoverage: originalCoverage,
          editableModuleCoverage: editableCoverage,
          existingRubyText: existing?.textContent || "",
          existingRubyOwned: existing?.hasAttribute("data-furihook-owned") || false,
          layoutIsClear: layoutIsClear(originalAnnotations),
          visibleOriginalAnnotationCount: originalAnnotations.filter((item) => item.visible).length,
          reactTranslationOnly: Boolean(react && react.mode === "translation"
            && react.postText === "今天去学校学习日语。" && react.postChildCount === 1
            && react.postNodeIdentityPreserved && react.postNodeParentPreserved
            && react.postNodeData === react.postText && reactAnnotations.length === 0),
          reactOriginalUpdated: Boolean(react && react.mode === "original"
            && react.postText === "今日は学校へ行きます。" && react.postChildCount === 1
            && react.postNodeIdentityPreserved && react.postNodeParentPreserved
            && react.postNodeData === react.postText
            && reactAnnotations.length > 0 && layoutIsClear(reactAnnotations)),
          reactListUpdated: Boolean(react && react.schoolText === "今日は大学。"
            && react.schoolNodeIdentityPreserved && react.schoolElementIdentityPreserved
            && react.addedText === "明日学校へ行く。" && react.addedRenderedByReact
            && react.removedRowDisconnected && reactRows.length > 0 && reactAdded.length > 0),
          react: react,
          reactAnnotationPairs: pairs(reactAnnotations),
          reactListAnnotationPairs: pairs(reactRows.concat(reactAdded)),
          inputAndEditableExcluded: editableNode.nodeType === Node.TEXT_NODE
            && editableCoverage.recordCount === 0 && editableCoverage.annotationCount === 0
            && document.getElementById("excluded-input").value === "漢字入力",
          existingRubyPreserved: Boolean(existing && existing.textContent === "漢かん" &&
            !existing.hasAttribute("data-furihook-owned"))
        };
        if (report.originalRubyMatch && report.reactTranslationOnly
            && (!updateRequested || report.updatedRubyMatch)) {
          report.phase = "ready";
        }
        const serialized = JSON.stringify(report);
        if (result.textContent !== serialized) result.textContent = serialized;
      }

      document.getElementById("test-link").addEventListener("click", () => {
        linkCount.textContent = String(Number(linkCount.textContent) + 1);
        renderReport();
      });
      document.getElementById("update-button").addEventListener("click", () => {
        updateRequested = true;
        updated.textContent = "明日は図書館へ行きます。";
        renderReport();
      });
      window.fixtureReport = renderReport;
      if (diagnosticRequested) {
        result.textContent = JSON.stringify({phase: "diagnostic-waiting"});
        stableDiagnosticCapture();
      } else {
        setInterval(renderReport, 250);
        renderReport();
      }
    })();
  </script>
  <script src="vendor/react-18.3.1.production.min.js"></script>
  <script src="vendor/react-dom-18.3.1.production.min.js"></script>
  <script>
    (() => {
      const h = React.createElement;
      const tracked = {post: null, rows: new Map(), removed: null};

      function ReactFixture() {
        const [mode, setMode] = React.useState('translation');
        const [rows, setRows] = React.useState([
          {key: 'school', text: '昨日は東京へ行きました。'},
          {key: 'tomorrow', text: '明日は図書館に行きます。'}
        ]);
        const source = mode === 'translation' ? '今天去学校学习日语。' : '今日は学校へ行きます。';

        React.useLayoutEffect(() => {
          const post = document.getElementById('react-current');
          if (!tracked.post && post) tracked.post = post.firstChild;
          for (const row of rows) {
            if (tracked.rows.has(row.key)) continue;
            const element = document.querySelector('[data-react-row="' + row.key + '"]');
            if (element) tracked.rows.set(row.key, {element, node: element.firstChild});
          }
          const tomorrow = tracked.rows.get('tomorrow');
          if (tomorrow && !rows.some(row => row.key === 'tomorrow')) tracked.removed = tomorrow;
        });

        window.reactFixture = {
          setMode,
          reconcileList() {
            setRows([
              {key: 'school', text: '今日は大学。'},
              {key: 'added', text: '明日学校へ行く。'}
            ]);
          },
          inspect() {
            const post = document.getElementById('react-current');
            const school = document.querySelector('[data-react-row="school"]');
            const added = document.querySelector('[data-react-row="added"]');
            const removed = tracked.removed;
            return {
              mode,
              postText: post.textContent,
              postChildCount: post.childNodes.length,
              postNodeIdentityPreserved: tracked.post === post.firstChild,
              postNodeParentPreserved: Boolean(tracked.post && tracked.post.parentNode === post),
              postNodeData: tracked.post ? tracked.post.data : null,
              schoolText: school ? school.textContent : null,
              schoolNodeIdentityPreserved: Boolean(school && tracked.rows.get('school')
                && tracked.rows.get('school').node === school.firstChild),
              schoolElementIdentityPreserved: Boolean(school && tracked.rows.get('school')
                && tracked.rows.get('school').element === school),
              addedText: added ? added.textContent : null,
              addedRenderedByReact: Boolean(added && added.firstChild
                && added.firstChild.nodeType === Node.TEXT_NODE),
              removedRowDisconnected: Boolean(removed && !removed.element.isConnected
                && !removed.node.isConnected),
              reactProduction: React.version === '18.3.1'
            };
          }
        };

        return h('div', {id: 'react-content'},
          h('button', {id: 'react-toggle', type: 'button', onClick: () => {
            setMode(current => current === 'translation' ? 'original' : 'translation');
          }}, mode === 'translation' ? '显示日语原文' : '显示中文译文'),
          h('button', {id: 'react-list-update', type: 'button', onClick: () => {
            setRows([
              {key: 'school', text: '今日は大学。'},
              {key: 'added', text: '明日学校へ行く。'}
            ]);
          }}, '更新 React 列表'),
          h('p', {id: 'react-current', lang: mode === 'original' ? 'ja' : 'zh'}, source),
          h('div', {id: 'react-list'}, rows.map(row => h('p', {
            key: row.key,
            id: 'react-row-' + row.key,
            'data-react-row': row.key
          }, row.text)))
        );
      }

      ReactDOM.createRoot(document.getElementById('react-root')).render(h(ReactFixture));
    })();
  </script>
</body>
</html>
