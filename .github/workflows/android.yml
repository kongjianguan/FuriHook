name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and run unit tests and lint
        run: ./gradlew :app:assembleDebug :testapp:assembleDebug :core:test :app:lintDebug :testapp:lintDebug --stacktrace
      - name: Verify packaged Modern API metadata
        run: python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" --output work/apk-verification
      - name: Upload APKs and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apks-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            testapp/build/outputs/apk/debug/*.apk
            core/build/test-results/test/
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
            testapp/build/reports/lint-results-debug.*
            work/apk-verification/
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build module APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android E2E
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run_emulator_e2e.sh
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-api-${{ matrix.api }}
          path: |
            testapp/build/reports/androidTests/connected/
            testapp/build/outputs/androidTest-results/connected/
            work/e2e/
          if-no-files-found: error
