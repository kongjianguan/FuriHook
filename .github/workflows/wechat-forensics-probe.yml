name: WeChat Forensics Probe (read-only)
on:
  push:
    branches: [experiment/wechat-forensics-probe]
    paths:
      - 'wechat-forensics-probe/**'
      - '.github/workflows/wechat-forensics-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build observe-only APK
        working-directory: wechat-forensics-probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify module scope and permission-free design
        shell: bash
        run: |
          set -euo pipefail
          apk=wechat-forensics-probe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(unzip -p "$apk" assets/xposed_init)" = 'dev.kongjianguan.wechatforensicsprobe.ProbeEntry'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='dev.kongjianguan.wechatforensicsprobe'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee /tmp/cot-permissions.txt
          ! grep -q 'uses-permission:' /tmp/cot-permissions.txt
          ! unzip -l "$apk" | grep -q 'lib/.*\.so'
          sha256sum "$apk" | tee wechat-forensics-probe/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-forensics-probe-debug-apk
          path: |
            wechat-forensics-probe/app/build/outputs/apk/debug/app-debug.apk
            wechat-forensics-probe/SHA256SUMS
          if-no-files-found: error
