name: WeChat Memory Guard (Android ARM64)

on:
  push:
    branches: [experiment/wechat-memory-guard]
    paths:
      - 'wechat-memory-guard/**'
      - '.github/workflows/wechat-memory-guard.yml'
  pull_request:
    paths:
      - 'wechat-memory-guard/**'
      - '.github/workflows/wechat-memory-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build experiment APK on Actions only
        working-directory: wechat-memory-guard
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify scope, native ABI, and no app permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=wechat-memory-guard/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libwmgpurge.so'
          test "$(unzip -p "$apk" assets/xposed_init)" = 'dev.kongjianguan.wechatmemoryguard.ModuleEntry'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='dev.kongjianguan.wechatmemoryguard'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee /tmp/wmg-permissions.txt
          ! grep -q 'uses-permission:' /tmp/wmg-permissions.txt
          sha256sum "$apk" | tee wechat-memory-guard/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-memory-guard-arm64-debug
          path: |
            wechat-memory-guard/app/build/outputs/apk/debug/app-debug.apk
            wechat-memory-guard/SHA256SUMS
          if-no-files-found: error
