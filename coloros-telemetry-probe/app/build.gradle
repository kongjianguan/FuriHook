plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.kongjianguan.colorostelemetryprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.kongjianguan.colorostelemetryprobe'
        minSdk 28
        targetSdk 34
        versionCode 4
        versionName '0.3.1-metis-multiprocess'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
