plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.kongjianguan.wechatforensicsprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.kongjianguan.wechatforensicsprobe'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0-observe-only'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
